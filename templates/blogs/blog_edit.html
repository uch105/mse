{% extends 'core/base.html' %}
{% load static %}

{% block title %}
Edit Blog
{% endblock %}

{% block meta_links %}
{% endblock %}

{% block head_scripts %}
<style>
body { 
    min-width: 1200px; 
}

.blog-edit-container {
    max-width: 1400px;
    margin: 0 auto;
    padding: 2rem 1rem;
}

.blog-edit-title {
    font-size: 2rem;
    font-weight: bold;
    margin: 0 0 1.5rem 0;
}

.blog-form {
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
}

.form-group {
    display: flex;
    flex-direction: column;
}

.form-label {
    font-weight: 600;
    margin-bottom: 0.5rem;
    color: #374151;
}

.form-input {
    padding: 0.5rem 1rem;
    border: 1px solid #d1d5db;
    border-radius: 4px;
    font-size: 0.875rem;
}

.form-input:focus {
    outline: none;
    border-color: #3b82f6;
    box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
}

.editor-container { 
    display: flex; 
    gap: 1.5rem; 
}

.editor-panel { 
    flex: 1; 
}

.preview-panel { 
    flex: 1; 
    background: #f9fafb; 
    padding: 1.5rem; 
    border-radius: 8px; 
    border: 1px solid #e5e7eb;
}

.toolbar { 
    display: flex; 
    gap: 0.5rem; 
    margin-bottom: 0.75rem; 
    flex-wrap: wrap; 
}

.toolbar-btn { 
    padding: 0.5rem 0.75rem; 
    background: #e5e7eb; 
    border: none; 
    border-radius: 4px; 
    cursor: pointer; 
    font-size: 0.875rem;
}

.toolbar-btn:hover { 
    background: #d1d5db; 
}

.content-textarea { 
    min-height: 400px; 
    width: 100%;
    font-family: 'Courier New', monospace;
    resize: vertical;
}

.preview-title {
    font-weight: 600;
    margin-bottom: 1rem;
    color: #374151;
}

.preview-content { 
    background: white; 
    padding: 1.5rem; 
    border-radius: 4px; 
    min-height: 400px; 
    border: 1px solid #e5e7eb;
    color: #374151;
}

.preview-content img { 
    max-width: 100%; 
    height: auto; 
}

.form-actions {
    display: flex;
    gap: 1rem;
}

.btn {
    padding: 0.5rem 1.5rem;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
    font-size: 0.875rem;
}

.btn-draft {
    background: #6b7280;
    color: white;
}

.btn-draft:hover {
    background: #4b5563;
}

.btn-submit {
    background: #eab308;
    color: white;
}

.btn-submit:hover {
    background: #ca8a04;
}

.btn-publish {
    background: #10b981;
    color: white;
}

.btn-publish:hover {
    background: #059669;
}

.btn-cancel {
    background: #ef4444;
    color: white;
}

.btn-cancel:hover {
    background: #dc2626;
}
</style>
{% endblock %}

{% block body %}
<main>
<div class="blog-edit-container">
    <h1 class="blog-edit-title">Edit Blog</h1>
    
    <form method="post" id="blogForm" class="blog-form">
        {% csrf_token %}
        
        <div class="form-group">
            <label class="form-label">Title</label>
            <input 
                type="text" 
                name="title" 
                id="title"
                value="{{ blog.title }}"
                required
                class="form-input"
            >
        </div>
        
        <div class="form-group">
            <label class="form-label">Keywords (comma-separated)</label>
            <input 
                type="text" 
                name="keywords" 
                id="keywords"
                value="{{ blog.keywords }}"
                placeholder="technology, web development, programming"
                class="form-input"
            >
        </div>
        
        <div class="form-group">
            <label class="form-label">Content</label>
            
            <div class="editor-container">
                <div class="editor-panel">
                    <div class="toolbar">
                        <button type="button" class="toolbar-btn" onclick="insertTag('h2')">H2</button>
                        <button type="button" class="toolbar-btn" onclick="insertTag('h3')">H3</button>
                        <button type="button" class="toolbar-btn" onclick="insertTag('strong')"><b>Bold</b></button>
                        <button type="button" class="toolbar-btn" onclick="insertTag('em')"><i>Italic</i></button>
                        <button type="button" class="toolbar-btn" onclick="insertTag('p')">Paragraph</button>
                        <button type="button" class="toolbar-btn" onclick="insertList('ul')">• List</button>
                        <button type="button" class="toolbar-btn" onclick="insertList('ol')">1. List</button>
                        <button type="button" class="toolbar-btn" onclick="insertLink()">🔗 Link</button>
                        <input type="file" id="imageUpload" accept="image/*" style="display:none" onchange="uploadImage()">
                        <button type="button" class="toolbar-btn" onclick="document.getElementById('imageUpload').click()">🖼️ Image</button>
                    </div>
                    <textarea 
                        name="content" 
                        id="content"
                        required
                        class="form-input content-textarea"
                        oninput="updatePreview()"
                    >{{ blog.content }}</textarea>
                </div>
                
                <div class="preview-panel">
                    <div class="preview-title">Preview</div>
                    <div class="preview-content" id="preview"></div>
                </div>
            </div>
        </div>
        
        <div class="form-actions">
            <button type="submit" name="status" value="drafted" class="btn btn-draft">
                Save as Draft
            </button>
            <button type="submit" name="status" value="submitted" class="btn btn-submit">
                Submit for Review
            </button>
            <button type="submit" name="status" value="published" class="btn btn-publish">
                Publish
            </button>
            <a href="{% url 'blog_detail' blog.slug %}" class="btn btn-cancel">
                Cancel
            </a>
        </div>
    </form>
</div>
</main>
{% endblock %}

{% block body_scripts %}
<script>
function updatePreview() {
    const title = document.getElementById('title').value;
    const content = document.getElementById('content').value;
    const preview = document.getElementById('preview');
    
    let html = '';
    if (title) {
        html += `<h1 style="font-size: 2rem; font-weight: bold; margin-bottom: 1rem;">${escapeHtml(title)}</h1>`;
    }
    html += content || '<p style="color: #9ca3af;">Your blog preview will appear here...</p>';
    
    preview.innerHTML = html;
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

function insertTag(tag) {
    const textarea = document.getElementById('content');
    const start = textarea.selectionStart;
    const end = textarea.selectionEnd;
    const selectedText = textarea.value.substring(start, end);
    const beforeText = textarea.value.substring(0, start);
    const afterText = textarea.value.substring(end);
    
    const newText = `<${tag}>${selectedText || 'Text here'}</${tag}>`;
    textarea.value = beforeText + newText + afterText;
    
    updatePreview();
    textarea.focus();
}

function insertList(type) {
    const textarea = document.getElementById('content');
    const start = textarea.selectionStart;
    const beforeText = textarea.value.substring(0, start);
    const afterText = textarea.value.substring(start);
    
    const listHtml = `<${type}>\n  <li>Item 1</li>\n  <li>Item 2</li>\n  <li>Item 3</li>\n</${type}>`;
    textarea.value = beforeText + listHtml + afterText;
    
    updatePreview();
    textarea.focus();
}

function insertLink() {
    const url = prompt('Enter URL:');
    if (!url) return;
    
    const text = prompt('Enter link text:', 'Click here');
    const textarea = document.getElementById('content');
    const start = textarea.selectionStart;
    const beforeText = textarea.value.substring(0, start);
    const afterText = textarea.value.substring(start);
    
    const linkHtml = `<a href="${url}" target="_blank">${text}</a>`;
    textarea.value = beforeText + linkHtml + afterText;
    
    updatePreview();
    textarea.focus();
}

async function uploadImage() {
    const fileInput = document.getElementById('imageUpload');
    const file = fileInput.files[0];
    if (!file) return;
    
    const formData = new FormData();
    formData.append('image', file);
    formData.append('blog_id', '{{ blog.id }}');
    formData.append('csrfmiddlewaretoken', '{{ csrf_token }}');
    
    try {
        const response = await fetch('{% url "upload_blog_image" %}', {
            method: 'POST',
            body: formData
        });
        
        const data = await response.json();
        if (data.success) {
            const textarea = document.getElementById('content');
            const start = textarea.selectionStart;
            const beforeText = textarea.value.substring(0, start);
            const afterText = textarea.value.substring(start);
            
            const imgHtml = `<img src="${data.url}" alt="Blog image" style="max-width: 100%; height: auto; margin: 20px 0;">`;
            textarea.value = beforeText + imgHtml + afterText;
            
            updatePreview();
            textarea.focus();
        }
    } catch (error) {
        alert('Error uploading image');
    }
    
    fileInput.value = '';
}

document.getElementById('title').addEventListener('input', updatePreview);
updatePreview();
</script>
{% endblock %}
